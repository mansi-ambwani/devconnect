server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Long cache for hashed build files
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Send every other route to index.html so React Router can handle it
  location / {
    try_files $uri /index.html;
  }
}
