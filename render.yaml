# Render Blueprint: deploys the database, the API (Docker) and the React site on Render's free plan.
# Render creates the database and passes its connection string to the API automatically.
databases:
  - name: devconnect-db
    plan: free
    region: singapore
    databaseName: devconnect
    user: devconnect
    postgresMajorVersion: "16"

services:
  - type: web
    name: devconnect-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devconnect-db
          property: connectionString # internal URL, private network
      - key: DB_SSL
        value: "false" # internal Render network; set to "true" if you switch to an external database
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://devconnect-web-1t2f.onrender.com

  - type: web
    name: devconnect-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://devconnect-api-b257.onrender.com
