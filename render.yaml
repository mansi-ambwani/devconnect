# Render Blueprint: deploys the API (Docker) and the React site on Render's free plan.
# Database: Neon free PostgreSQL — paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: devconnect-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # you paste the Neon connection string in the Render dashboard
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*" # tighten to the website URL after the first deploy

  - type: web
    name: devconnect-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://devconnect-api.onrender.com # updated after the API's real URL is known
