# Frontend pipeline: build the React app -> deploy to Azure Static Web Apps (Free plan)
name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SWA: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        if: env.HAS_SWA == 'true' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist # already built above
          skip_app_build: true
          skip_api_build: true

      - name: Reminder if deploy was skipped
        if: env.HAS_SWA != 'true'
        run: echo "::notice::Build succeeded. Deploy skipped because AZURE_STATIC_WEB_APPS_API_TOKEN is not set."
